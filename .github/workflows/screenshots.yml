name: Record screenshots

# Records the golden images of the screenshot tests (Roborazzi) on Linux, the system CI verifies them on.
# Run it from the Actions tab on the branch whose images changed, download the artifact and commit the files
# into the folder named below. See docs/process/conventions.md, "Тесты".

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  record:
    name: Record (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Record
        run: >
          ./gradlew :shared:designsystem:cleanDesktopTest :shared:designsystem:desktopTest
          -Proborazzi.test.record=true

      - name: Upload the images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: shared/designsystem/src/desktopTest/screenshots/
          retention-days: 7
