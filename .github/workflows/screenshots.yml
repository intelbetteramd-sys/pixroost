name: Record screenshots

# Records the golden images of the screenshot tests (Roborazzi) on Linux, the system CI verifies them on.
# Run it from the Actions tab on the branch whose images changed, download the artifact and commit the files
# into the folder named below. See docs/process/conventions.md, "Тесты".

on:
  workflow_dispatch:
  # TEMPORARY: records the first golden images of PR #90; removed in the next commit.
  push:
    branches: [feat/90-theme-tokens]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  record:
    name: Record (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Record
        run: >
          ./gradlew :shared:designsystem:cleanDesktopTest :shared:designsystem:desktopTest
          -Proborazzi.test.record=true

      - name: Upload the images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: shared/designsystem/src/desktopTest/screenshots/
          retention-days: 7
