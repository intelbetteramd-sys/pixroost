# Only the differences from the detekt defaults (buildUponDefaultConfig = true).

naming:
  FunctionNaming:
    # Composable functions are named like types: LampMark, PixroostPlaceholder.
    ignoreAnnotated: ['Composable']
    # Test names are sentences in backticks (docs/process/conventions.md); the defaults list every test source
    # set except desktopTest.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
      - '**/desktopTest/**'
      - '**/androidHostTest/**'
      - '**/androidDeviceTest/**'

style:
  MagicNumber:
    # The default test exclusions, plus desktopTest and androidHostTest: this project runs JVM tests there.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/androidHostTest/**'
      - '**/androidDeviceTest/**'
      - '**/desktopTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
      - '**/*.kts'
